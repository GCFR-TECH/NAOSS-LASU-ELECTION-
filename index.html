<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAOSS LASU 2026 Election</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #17251d;
    }

    header {
      background: #063b20;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: 25px auto;
    }

    .notice {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .notice h2 {
      color: #063b20;
      margin-bottom: 10px;
    }

    .position {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .position h3 {
      color: #063b20;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    label {
      display: block;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      background: #fafafa;
    }

    label:hover {
      background: #eef7f1;
    }

    input[type="radio"] {
      margin-right: 10px;
    }

    .vote-btn {
      width: 100%;
      padding: 16px;
      background: #063b20;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .vote-btn:hover {
      background: #075b30;
    }

    .result {
      display: none;
      background: #e8f5ec;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 30px;
      background: #063b20;
      color: white;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      .container {
        width: 94%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>NAOSS LASU 2026</h1
